<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вход</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #0f0f1a;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
    overflow: hidden;
    position: relative;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    box-sizing: border-box;
  }

  .hearts {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
  }

  .heart {
    position: absolute;
    top: 110%;
    color: rgba(255, 105, 180, 0.35);
    font-size: 20px;
    animation: floatUp linear infinite;
    user-select: none;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 0;
    }
    10% {
      opacity: 1;
    }
    90% {
      opacity: 1;
    }
    100% {
      transform: translateY(-120vh) rotate(20deg);
      opacity: 0;
    }
  }
  .box {
    background: rgba(28, 28, 46, 0.85);
    padding: 32px 24px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    text-align: center;
    width: 100%;
    max-width: 320px;
    position: relative;
    z-index: 1;
  }
  h1 {
    font-size: 20px;
    margin-bottom: 20px;
    font-weight: 500;
  }
  input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    outline: none;
    font-size: 16px;
    box-sizing: border-box;
    text-align: center;
    margin-bottom: 15px;
  }
  button {
    width: 100%;
    padding: 14px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(135deg, #ff8fb1, #ff6b9d);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(255, 107, 157, 0.4);
    transition: 0.2s;
  }
  button:hover {
    background: linear-gradient(135deg, #ff7ba3, #ff5590);
    box-shadow: 0 6px 18px rgba(255, 107, 157, 0.5);
    transform: translateY(-1px);
  }
  #error {
    color: #ff6b6b;
    margin-top: 10px;
    font-size: 14px;
    min-height: 18px;
  }
</style>
</head>
<body>

<div class="hearts" id="hearts"></div>

<div class="box">
  <h1>Кого я боюсь из людей?</h1>
  <input type="text" id="answer" placeholder="Твой ответ" autocomplete="off">
  <button onclick="checkAnswer()">Войти</button>
  <div id="error"></div>
</div>

<script>
  const correctAnswer = "папа"; // можно поменять на что угодно

  function checkAnswer() {
    const input = document.getElementById('answer').value.trim().toLowerCase();
    if (input === correctAnswer) {
      window.location.href = "secret.html";
    } else {
      document.getElementById('error').innerText = "Неверно, попробуй ещё раз";
    }
  }

  // Enter тоже работает
  document.getElementById('answer').addEventListener('keydown', function(e) {
    if (e.key === "Enter") checkAnswer();
  });

  // Генерация летающих сердечек
  const heartsContainer = document.getElementById('hearts');
  const heartCount = 40;

  for (let i = 0; i < heartCount; i++) {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.innerHTML = '♥';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.fontSize = (12 + Math.random() * 18) + 'px';
    heart.style.animationDuration = (6 + Math.random() * 8) + 's';
    heart.style.animationDelay = (Math.random() * 8) + 's';
    heart.style.opacity = 0.2 + Math.random() * 0.4;
    heartsContainer.appendChild(heart);
  }
</script>

</body>
</html>
