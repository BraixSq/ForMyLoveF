<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>❤</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0f0f1a;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
  }

  .word {
    position: absolute;
    color: #ff6b9d;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.6);
    transition: top 2.2s cubic-bezier(0.2, 0.8, 0.2, 1),
                left 2.2s cubic-bezier(0.2, 0.8, 0.2, 1),
                opacity 1s ease,
                transform 2.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    text-shadow: 0 0 8px rgba(255, 107, 157, 0.6);
    pointer-events: none;
  }

  .word.placed {
    opacity: 0.95;
    transform: translate(-50%, -50%) scale(1);
  }

  .caption {
    position: absolute;
    bottom: 6%;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.6);
    font-size: 14px;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 1.5s ease;
    z-index: 2;
  }

  .caption.show {
    opacity: 1;
  }
</style>
</head>
<body>

<div class="stage" id="stage"></div>
<div class="caption" id="caption">я тебя люблю ❤</div>

<script>
  const stage = document.getElementById('stage');
  const caption = document.getElementById('caption');

  // Параметрическое уравнение сердца -> точки строго по контуру, по порядку
  function heartPoints(count) {
    const points = [];
    for (let i = 0; i < count; i++) {
      // равномерный шаг по углу — слова лягут ровно на линию контура
      const t = (i / count) * Math.PI * 2;
      // маленький джиттер, чтобы слова не сидели ровно друг на друге
      const jitter = 0.97 + Math.random() * 0.06;
      const x = 16 * Math.pow(Math.sin(t), 3) * jitter;
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * jitter;
      points.push({x, y});
    }
    return points;
  }

  function buildHeart() {
    stage.innerHTML = '';
    caption.classList.remove('show');

    // берём реальные размеры контейнера, а не window,
    // чтобы корректно работало и во встроенных превью/iframe
    const rect = stage.getBoundingClientRect();
    const width = rect.width;
    const height = rect.height;

    const wordCount = 300;
    const points = heartPoints(wordCount);

    const scale = Math.min(width, height) / 45;
    const centerX = width / 2;
    const centerY = height / 2 - height * 0.03;

    points.forEach((p, i) => {
      const el = document.createElement('div');
      el.className = 'word';
      el.textContent = 'i love you';

      const startX = Math.random() * width;
      const startY = height + 40 + Math.random() * 200;

      el.style.left = startX + 'px';
      el.style.top = startY + 'px';
      el.style.fontSize = (8 + Math.random() * 4) + 'px';

      stage.appendChild(el);

      const targetX = centerX + p.x * scale;
      const targetY = centerY + p.y * scale;

      setTimeout(() => {
        el.classList.add('placed');
        el.style.left = targetX + 'px';
        el.style.top = targetY + 'px';
      }, 100 + i * 9 + Math.random() * 150);
    });

    setTimeout(() => {
      caption.classList.add('show');
    }, 100 + wordCount * 9 + 1800);
  }

  // небольшая задержка, чтобы браузер успел посчитать реальные размеры контейнера
  window.addEventListener('load', () => {
    requestAnimationFrame(() => setTimeout(buildHeart, 50));
  });

  // пересобираем при изменении размера окна (поворот телефона и т.п.)
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(buildHeart, 300);
  });
</script>

</body>
</html>
